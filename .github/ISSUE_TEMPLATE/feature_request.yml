name: Feature request
description: Suggest an idea for GatherPath Forever
title: "[Idea] "
labels: ["enhancement"]
assignees: ["severd8"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Something new routes could do, a new look, or a setting you'd use.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What problem does it solve?
